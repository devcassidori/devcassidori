<svg width="1000" height="1180" viewBox="0 0 1000 1180" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.5"></feDropShadow>
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"></feGaussianBlur>

      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    <style>
      .terminal {
        font-family:
          "JetBrains Mono",
          "Fira Code",
          "Courier New",
          monospace;
      }

      .prompt {
        fill: #00ff88;
        font-weight: bold;
      }

      .command {
        fill: #58a6ff;
        font-weight: bold;
      }

      .command-text {
        fill: #f0f6fc;
      }

      .output {
        fill: #00ff88;
      }

      .muted {
        fill: #8b949e;
      }
    </style>

  </defs>


  <!-- ====================================================== -->
  <!-- TERMINAL WINDOW -->
  <!-- ====================================================== -->

  <rect x="10" y="10" width="980" height="1160" rx="16" fill="#0d1117" filter="url(#shadow)"></rect>

  <rect x="10" y="10" width="980" height="1160" rx="16" fill="none" stroke="#30363d" stroke-width="2"></rect>


  <!-- ====================================================== -->
  <!-- HEADER -->
  <!-- ====================================================== -->

  <rect x="10" y="10" width="980" height="50" rx="16" fill="#161b22"></rect>

  <rect x="10" y="42" width="980" height="18" fill="#161b22"></rect>

  <!-- Window buttons -->

  <circle cx="38" cy="35" r="7" fill="#ff5f56"></circle>

  <circle cx="62" cy="35" r="7" fill="#ffbd2e"></circle>

  <circle cx="86" cy="35" r="7" fill="#27c93f"></circle>

  <!-- Header title -->

  <text x="500" y="40" text-anchor="middle" class="terminal muted" font-size="14">

    lucas@devcassidori: ~

  </text>


